spec_version: "0.1.0"
name: "opencode-agent-harness"
version: "1.0.0"
description: >
  Terminal-first autonomous AI coding agent supporting multi-model execution,
  LSP diagnostics, AST-aware diffing, and sandboxed shell execution.
author: "Chithra R"
license: "MIT"

model:
  preferred: "claude-3-5-sonnet"
  fallback:
    - "gpt-4o"
    - "gemini-2.0-flash"
  constraints:
    temperature: 0.1
    max_tokens: 8192

skills:
  - terminal-coding-loop
  - lsp-codebase-navigation
  - ast-aware-diff-patching
  - subagent-task-delegation

tools:
  - terminal-shell-runner
  - file-editor-patcher
  - lsp-symbol-inspector
  - codebase-grep-scanner
  - subagent-task-coordinator

runtime:
  max_turns: 25
  temperature: 0.1
  timeout: 180

compliance:
  risk_tier: standard
  frameworks:
    - mitre-atlas
    - owasp-llm
  data_governance:
    pii_handling: redact
    data_classification: confidential
  recordkeeping:
    audit_logging: true
    log_format: structured_json
  supervision:
    human_in_the_loop: conditional
    override_capability: true
    kill_switch: true

tags:
  - developer-tools
  - coding-agent
  - terminal-ui
  - lsp
  - multi-model
  - diff-patching
  - autonomous-coding

metadata:
  domain: "developer-tools"
  category: "Developer Tools"
